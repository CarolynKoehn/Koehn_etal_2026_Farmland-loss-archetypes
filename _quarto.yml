project:
  type: manuscript
  
manuscript: 
  article: chap2_manuscript.qmd

notebook-links: false

execute:
  echo: false
  freeze: auto
  
filters:
  - multibib
validate-yaml: false
citeproc: false
  
bibliography: 
  main: chap2.bib
  data: chap2_data.bib
csl: elsevier-harvard-modified.csl

format:
  # pdf:
  #   keep-tex: true
  #   cite-method: citeproc
  #   include-in-header: 
  #     text: |
  #       \usepackage[format=plain]{caption}
  docx: 
    reference-doc: custom-reference-doc.docx
    notebook-links: false
    number-sections: true
    fig-format: png
    df-print: kable
    link-bibliography: false
    link-citations: false
    crossref:
      ref-hyperlink: false
      custom:
        - kind: float
          key: supptbla
          reference-prefix: Table A
          space-before-numbering: false
          caption-location: top
        - kind: float
          key: suppfiga
          reference-prefix: Figure A
          space-before-numbering: false
        - kind: float
          key: supptblb
          reference-prefix: Table B
          space-before-numbering: false
          caption-location: top
        - kind: float
          key: suppfigb
          reference-prefix: Figure B
          space-before-numbering: false



